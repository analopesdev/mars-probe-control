[project]
name = "mars-probe-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "uvicorn>=0.54.0",
]

[tool.uv.workspace]
members = [
    "mars-probe-api",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
