services:
  # Backend FastAPI
  - type: web
    name: mars-probe-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /probes
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        sync: false   # URL do front, ex.: https://mars-probe-web.onrender.com

  # Frontend Vite/React (site estático)
  - type: web
    name: mars-probe-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # URL do backend, ex.: https://mars-probe-api.onrender.com
